aid: konfetti
name: konfetti
description: >-
  konfetti (Konfetti GmbH, Berlin) operates a marketplace for bookable
  experiences — cooking classes, pottery and ceramics workshops, cocktail
  courses, tastings, boat tours, creative and craft workshops, DIY kits and
  team events — across Germany and Austria, with more than 7,600 bookable
  experience listings and coverage in Berlin, Munich, Cologne, Hamburg,
  Frankfurt, Stuttgart, Dusseldorf, Leipzig, Dresden, Hannover, Nuremberg,
  Muenster, Heidelberg and Vienna. Alongside the consumer storefront, konfetti
  sells an all-in-one booking-management product to its partner hosts: a
  back-office at backoffice.gokonfetti.com for managing experiences, dates,
  tickets, gift cards, invoicing and payouts, plus an embeddable booking
  solution and a set of embeddable widgets that partners place on their own
  websites and social channels. konfetti is backed by Speedinvest. It publishes
  no public developer portal or API reference; the JSON API behind the
  storefront at api.gokonfetti.com is documented here observationally by API
  Evangelist.
